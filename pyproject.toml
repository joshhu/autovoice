[project]
name = "autovoice"
version = "0.1.0"
description = "影片聲音克隆配音工具"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "huggingface-hub>=0.25.0",
    "transformers>=4.46.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
