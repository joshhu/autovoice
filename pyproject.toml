[project]
name = "autovoice"
version = "0.1.0"
description = "影片聲音克隆配音工具"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "huggingface-hub>=0.25.0",
    "transformers>=4.46.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
markers = [
    "integration: 整合測試，需要 GPU 與真實模型",
]
